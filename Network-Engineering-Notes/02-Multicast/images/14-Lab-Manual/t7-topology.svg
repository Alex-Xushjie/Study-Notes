<rect x="45" y="609" width="1810" height="106" rx="12" fill="#ffffff" stroke="#dbe3ed" stroke-width="1" />
<text x="950.0" y="649.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526477">RP-A and RP-B retain separate RP identities; investigate source discovery and source reachability across the boundary.</text>
<text x="950.0" y="671.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526477">Suggested chain interface convention: left-facing Gi0/0, right-facing Gi0/1; host links use eth0.</text>
