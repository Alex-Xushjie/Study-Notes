<text x="900.0" y="709.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526477">Source, upstream transit, and downstream receiver LANs use separate subnets.</text>
<text x="900.0" y="731.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526477">The multicast VLAN-service experiment is a separate switch-based variant; see the taskbook for the port/VLAN plan.</text>
