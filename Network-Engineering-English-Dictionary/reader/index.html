<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Network Engineering English Dictionary</title>
  <style>
    :root{--ink:#162d39;--muted:#576d74;--blue:#09748b;--pale:#e6f3f2;--rule:#d6e2df}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#e9efed;font-family:Arial,Helvetica,sans-serif;line-height:1.55}
    a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button,input{font:inherit}button{cursor:pointer}
    .book{max-width:1220px;min-height:100vh;margin:26px auto;background:white;box-shadow:0 9px 36px #123d4220;border-top:8px solid var(--blue)}
    .page{padding:clamp(24px,4.6vw,66px)}.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:30px}
    .brand{color:var(--ink);font-weight:750;font-size:.87rem;letter-spacing:.04em}.navlinks{display:flex;gap:18px;align-items:center;font-size:.87rem;font-weight:700}
    .eyebrow{color:var(--blue);font-size:.74rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:0 0 14px}
    h1,h2,h3,p{margin:0}h1{font-size:clamp(2.3rem,4.7vw,4.4rem);line-height:1.05;letter-spacing:-.045em;max-width:19ch}h2{font-size:1.3rem;line-height:1.3;letter-spacing:-.015em}h3{font-size:1.04rem;line-height:1.3}
    .intro{color:var(--muted);font-size:1.06rem;max-width:70ch;margin-top:16px}.small{font-size:.87rem;color:var(--muted)}
    .search{display:flex;gap:10px;max-width:660px;margin:25px 0 0}.search input{width:100%;padding:13px 16px;border:1px solid #b7cbc8;border-radius:7px;background:#fff;color:var(--ink)}.search button{border:0;border-radius:7px;padding:0 18px;background:var(--blue);color:white;font-weight:700}
    .section-heading{display:flex;align-items:center;gap:15px;margin:38px 0 18px}.section-heading:after{content:"";height:1px;flex:1;background:var(--rule)}
    .parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 48px}.part{border-top:3px solid var(--blue);padding-top:13px}.part h2{font-size:1.05rem;margin-bottom:10px}.chapter-link{display:flex;gap:12px;padding:7px 0;color:var(--ink);font-size:.94rem}.chapter-link span{color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
    .chapter-pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}.page-card{display:block;border:1px solid var(--rule);border-radius:8px;padding:19px;color:var(--ink);background:#fbfdfc}.page-card:hover{border-color:var(--blue);text-decoration:none}.page-card strong{display:block;font-size:1.06rem}.page-card small{color:var(--muted)}
    .picture{margin:28px 0 0}.picture img{display:block;width:100%;height:auto;border-radius:3px;background:#f8faf9}.picture figcaption{margin-top:8px;color:#728389;font-size:.76rem}.picture .diagram-scroll{overflow-x:auto;overscroll-behavior-inline:contain}.picture .diagram-scroll img{min-width:740px}.picture .scroll-hint{display:none}@media(max-width:820px){.picture .scroll-hint{display:block;margin:8px 0;color:#576d74;font-size:.8rem}}
    .words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:28px;row-gap:14px}.word{display:grid;grid-template-columns:32px 1fr;gap:11px;align-items:start;padding:13px 0;border-top:1px solid var(--rule)}.word.plain{grid-template-columns:1fr}.number{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--blue);font-weight:700;font-size:.88rem}.word strong{display:block;font-size:1.04rem;line-height:1.25}.word p{color:var(--muted);font-size:.9rem;margin-top:5px}.word details{margin-top:7px}.word summary{cursor:pointer;color:var(--blue);font-size:.82rem;font-weight:700}.word details p{border-left:2px solid #a9cfcc;padding-left:10px}
    .use{margin-top:38px;padding:25px 28px;background:var(--pale);border-left:5px solid var(--blue)}.use h2{color:#075f72;font-size:1rem;letter-spacing:.02em}.phrases{display:grid;grid-template-columns:1fr 1fr;gap:14px 30px;margin-top:15px}.phrases p{font-size:.98rem}
    .tags{display:flex;flex-wrap:wrap;gap:9px}.tag{display:inline-block;padding:7px 11px;border:1px solid var(--rule);border-radius:5px;font-size:.9rem}.notice{margin:26px 0 0;padding:16px 18px;border-left:4px solid #c4d8d5;background:#f5f8f7;color:var(--muted);font-size:.9rem}
    .entry-body{max-width:760px}.entry-body section{margin-top:32px}.entry-body section h2{margin-bottom:10px}.entry-body p{color:var(--muted)}.entry-examples{display:grid;gap:10px}.entry-examples blockquote{margin:0;padding:13px 17px;background:var(--pale);border-left:4px solid var(--blue)}
    .results{list-style:none;padding:0;margin:22px 0 0}.results li{border-top:1px solid var(--rule)}.results a{display:flex;justify-content:space-between;gap:15px;padding:13px 0}.results small{color:var(--muted)}
    .footer{display:flex;justify-content:space-between;gap:12px;margin-top:42px;padding-top:15px;border-top:1px solid var(--rule);color:#728389;font-size:.75rem}
    :focus-visible{outline:3px solid #e28539;outline-offset:3px}
    @media(max-width:760px){.book{margin:0}.page{padding:28px 22px}.parts,.chapter-pages{grid-template-columns:1fr}.words{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .practice-box{margin-top:22px}.practice-box label{display:block;font-weight:700;margin-bottom:8px}.practice-box textarea{display:block;width:100%;min-height:150px;border:1px solid #a7c2c2;border-radius:7px;padding:12px;font:inherit;color:var(--ink);resize:vertical}.model-answer{margin-top:22px;padding:16px 20px;border:1px solid var(--rule);border-radius:8px;background:#f8fbfa}.model-answer summary{color:var(--blue);font-weight:700;cursor:pointer}
    @media(max-width:460px){.words,.phrases{grid-template-columns:1fr}.word{padding:10px 0}.use{padding:20px}.navlinks{gap:12px}}
    @media print{body{background:white}.book{margin:0;box-shadow:none}.page{padding:12mm}.word,.use{break-inside:avoid}.nav,.search{display:none}}
  </style>
</head>
<body>
<main class="book"><div class="page"><nav class="nav" aria-label="Dictionary navigation"><a class="brand" href="#home">NETWORK ENGINEERING ENGLISH</a><div class="navlinks"><a href="#home">All chapters</a><a href="#search">Find a word</a></div></nav><div id="app" aria-live="polite"></div><footer class="footer"><span>NETWORK ENGINEERING ENGLISH DICTIONARY</span><span>READING EDITION · DRAFT</span></footer></div></main>
<noscript>This reading edition requires JavaScript. The original Markdown chapters remain available in the project.</noscript>
<script src="data.js"></script>
<script>
(()=>{
  'use strict';
  const data=window.DICTIONARY_DATA, app=document.getElementById('app');
  const chapters=Object.fromEntries(data.chapters.map(c=>[c.number,c]));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const entryUrl=k=>'#entry/'+k;
  const searchForm=(value='')=>`<form class="search" id="search-form" role="search"><input id="query" type="search" placeholder="Search English words and expressions" aria-label="Search dictionary" value="${esc(value)}"><button type="submit">Search</button></form>`;
  const examples=(list,title='SAY IT AT WORK')=>list.length?`<section class="use"><h2>${esc(title)}</h2><div class="phrases">${list.map(x=>`<p>“${esc(x)}”</p>`).join('')}</div></section>`:'';
  const tags=list=>list.length?`<div class="tags">${list.map(x=>`<a class="tag" href="${entryUrl(x.entry)}">${esc(x.label)}</a>`).join('')}</div>`:'';
  const extraSections=list=>list.map(section=>`<div class="section-heading"><h2>${esc(section.title)}</h2></div><div class="entry-body">${section.blocks.map(block=>{const text=block.segments.map(segment=>segment.entry?`<a href="${entryUrl(segment.entry)}">${esc(segment.text)}</a>`:esc(segment.text)).join('');return block.quote?`<div class="entry-examples" style="margin:12px 0"><blockquote>${text}</blockquote></div>`:`<p style="margin:12px 0">${text}</p>`}).join('')}</div>`).join('');
  function home(){
    document.title='Network Engineering English Dictionary';
    app.innerHTML=`<p class="eyebrow">A visual dictionary for network engineers</p><h1>Words for the network world.</h1><p class="intro">Explore the equipment, concepts and expressions used in network engineering. Choose a chapter or search for a word.</p>${searchForm()}<div class="section-heading"><h2>Learn by work scenario</h2></div><div class="chapter-pages"><a class="page-card" href="#page/22/03-interface-flapping"><small>WORK SCENARIO · PILOT</small><strong>Interface flapping</strong><small>Describe the evidence · Ask the provider · Give an update</small></a></div><div class="section-heading"><h2>Browse by chapter</h2></div><div class="parts">${data.parts.map(p=>`<section class="part"><h2>${esc(p.title)}</h2>${p.chapters.map(n=>`<a class="chapter-link" href="#chapter/${n}"><span>${esc(n)}</span>${esc(chapters[n].title)}</a>`).join('')}</section>`).join('')}</div><p class="notice">This is a reading edition of the first draft. Some subjects are text-first while their illustrations are discussed. Technical and language review is ongoing.</p>`;
  }
  function chapter(n){
    const c=chapters[n];if(!c)return notFound();document.title=`Chapter ${c.number} · ${c.title}`;
    app.innerHTML=`<p class="eyebrow">Part ${String(c.part).padStart(2,'0')} · Chapter ${esc(c.number)}</p><h1>${esc(c.title)}</h1><p class="intro">Choose a topic to read its words and examples. Select any word to see its full entry.</p><div class="chapter-pages">${c.pages.map((p,i)=>`<a class="page-card" href="#page/${c.number}/${encodeURIComponent(p.slug)}"><small>${String(i+1).padStart(2,'0')} · ${p.image?'Illustrated page':'Text-first page'}</small><strong>${esc(p.title)}</strong><small>${p.terms.length} ${p.slug==='03-interface-flapping'?'expressions':'key terms'} · ${p.slug==='03-interface-flapping'?'dialogue and practice':`${p.examples.length} examples`}</small></a>`).join('')}</div>${examples(c.examples)}<div class="section-heading"><h2>All words in this chapter</h2></div><div class="tags">${c.entries.map(k=>`<a class="tag" href="${entryUrl(k)}">${esc(data.entries[k].headword)}</a>`).join('')}</div>${c.sources.length?`<div class="section-heading"><h2>References</h2></div><div class="tags">${c.sources.map(s=>`<a class="tag" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`).join('')}</div>`:''}`;
  }
  function page(n,slug){
    const c=chapters[n],p=c?.pages.find(x=>x.slug===slug);if(!p)return notFound();document.title=`${p.title} · ${c.title}`;
    const diagram=p.image&&((c.number==='05'&&['01-layers','02-encapsulation'].includes(p.slug))||(c.number==='06'&&['01-vlan','02-frame'].includes(p.slug))||(c.number==='07'&&['01-ipv4','02-ipv6'].includes(p.slug))||(c.number==='08'&&['01-tcp','02-dns'].includes(p.slug))||(c.number==='09'&&['01-forwarding','02-prefix'].includes(p.slug))||(c.number==='10'&&['01-neighbors','02-calculation'].includes(p.slug))||(c.number==='22'&&p.slug==='03-interface-flapping')); const pic=p.image?`<figure class="picture">${diagram?'<p class="scroll-hint">Scroll sideways to explore the diagram.</p><div class="diagram-scroll" tabindex="0" aria-label="Diagram; scroll sideways to see the full image">':''}<img src="../assets/${encodeURIComponent(p.image)}" alt="${esc(p.alt)}">${diagram?'</div>':''}<figcaption>${esc(p.caption||'Illustrative scene; equipment and layouts vary.')}${diagram?` <a href="../assets/${encodeURIComponent(p.image)}" target="_blank" rel="noopener noreferrer">Open full-size diagram</a>`:''}</figcaption></figure>`:`<p class="notice">This topic is text-first while its illustration is being discussed.</p>`;
    const words=p.terms.map(t=>{const e=t.entry&&data.entries[t.entry];const detail=e?`<details><summary>Learn more</summary><p>${esc(e.usage||e.definition)}</p><p><a href="${entryUrl(t.entry)}">Open full entry →</a></p></details>`:'';return `<div class="word ${t.number?'':'plain'}">${t.number?`<span class="number">${esc(t.number)}</span>`:''}<div><strong>${esc(t.word)}</strong><p>${esc(t.meaning)}</p>${detail}</div></div>`}).join('');
    app.innerHTML=`<p class="eyebrow"><a href="#chapter/${c.number}">Chapter ${esc(c.number)} · ${esc(c.title)}</a></p><h1>${esc(p.title)}</h1><p class="intro">${p.slug==='03-interface-flapping'?'Use the scene to practise explaining the issue and talking to the provider.':p.image?'Look at the picture, then match each number with the words below.':'Read the key terms and examples below.'}</p>${pic}<div class="section-heading"><h2>${p.slug==='03-interface-flapping'?'Professional expressions':p.image?'Picture words':'Key terms'}</h2></div><div class="words">${words}</div>${examples(p.examples)}${p.more.length?`<div class="section-heading"><h2>More words</h2></div>${tags(p.more)}`:''}${extraSections((p.extras||[]).filter(x=>x.title!=='Model answer'))}${p.slug==='03-interface-flapping'?`<div class="practice-box"><label for="practice-answer">Write your response</label><textarea id="practice-answer" rows="6" placeholder="Write your provider request and status update here. Your draft stays on this page and is not saved."></textarea><p class="small">Your draft is not saved when you leave or refresh this page.</p></div>`:''}${p.extras?.some(x=>x.title==='Model answer')?`<details class="model-answer"><summary>Show a possible answer</summary>${extraSections(p.extras.filter(x=>x.title==='Model answer'))}</details>`:''}<p class="small" style="margin-top:28px"><a href="#chapter/${c.number}">← Back to ${esc(c.title)}</a></p>`;
  }
  function entry(n,slug){
    const e=data.entries[n+'/'+slug],c=chapters[n];if(!e||!c)return notFound();document.title=`${e.headword} · Dictionary`;
    app.innerHTML=`<div class="entry-body"><p class="eyebrow"><a href="#chapter/${n}">Chapter ${esc(n)} · ${esc(c.title)}</a></p><h1>${esc(e.headword)}</h1><div class="section-heading"><h2>Definition</h2></div><p>${esc(e.definition)}</p>${e.usage?`<section><h2>Usage and distinctions</h2><p>${esc(e.usage)}</p></section>`:''}${e.combinations?`<section><h2>Common combinations</h2><p>${esc(e.combinations)}</p></section>`:''}<section><h2>Examples</h2><div class="entry-examples">${e.examples.map(x=>`<blockquote>${esc(x)}</blockquote>`).join('')}</div></section><p class="small" style="margin-top:32px">Draft entry · Independent technical and language review is ongoing.</p><p class="small" style="margin-top:20px"><a href="#chapter/${n}">← Back to chapter</a></p></div>`;
  }
  function search(q){
    q=(q||'').trim();document.title='Find a word · Dictionary';const needle=q.toLocaleLowerCase();
    const all=Object.values(data.entries).filter(e=>!needle||e.headword.toLocaleLowerCase().includes(needle)||(e.aliases||[]).some(alias=>alias.toLocaleLowerCase().includes(needle))).sort((a,b)=>a.headword.localeCompare(b.headword));
    app.innerHTML=`<p class="eyebrow">English index</p><h1>Find a word.</h1><p class="intro">Search the ${Object.keys(data.entries).length} draft entries by headword or expression.</p>${searchForm(q)}<p class="small" style="margin-top:18px">${all.length} ${all.length===1?'entry':'entries'}${needle?' found':''}</p><ul class="results">${all.map(e=>`<li><a href="${entryUrl(e.key)}"><strong>${esc(e.headword)}</strong><small>Chapter ${esc(e.chapter)}</small></a></li>`).join('')}</ul>`;
  }
  function notFound(){app.innerHTML='<h1>Page not found.</h1><p class="intro"><a href="#home">Return to all chapters</a>.</p>'}
  function route(){const raw=location.hash.slice(1)||'home';const [kind,a,b]=raw.split('/').map(decodeURIComponent);if(kind==='chapter')chapter(a);else if(kind==='page')page(a,b);else if(kind==='entry')entry(a,b);else if(kind==='search')search(a||'');else home();window.scrollTo(0,0)}
  document.addEventListener('submit',event=>{if(event.target.id!=='search-form')return;event.preventDefault();const q=document.getElementById('query').value.trim();const hash='#search/'+encodeURIComponent(q);if(location.hash===hash)route();else location.hash=hash});
  window.addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
