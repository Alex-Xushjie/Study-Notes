<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" role="img" aria-labelledby="t d"><title id="t">VLANs across two switches</title><desc id="d">Two switches have access ports connected to hosts in VLAN 10 and VLAN 20. A trunk between the switches carries both VLANs.</desc><rect width="1500" height="980" fill="#f5f8f7"/><g font-family="Arial,sans-serif" fill="#203f49"><text x="60" y="68" font-weight="700" font-size="38">TWO VLANs, TWO SWITCHES</text><text x="60" y="108" font-size="23" fill="#5d7478">One example of access ports and an 802.1Q trunk</text>
<g stroke-width="10" fill="none"><path d="M335 255 L335 365" stroke="#3192b1"/><path d="M335 615 L335 725" stroke="#d08746"/><path d="M1165 255 L1165 365" stroke="#3192b1"/><path d="M1165 615 L1165 725" stroke="#d08746"/><path d="M480 470 L1020 470" stroke="#3192b1"/><path d="M480 510 L1020 510" stroke="#d08746"/></g>
<g fill="#e0f0f3" stroke="#3c8da4" stroke-width="3"><rect x="170" y="160" width="330" height="100" rx="12"/><rect x="1000" y="160" width="330" height="100" rx="12"/></g><g fill="#fbecdf" stroke="#cf925d" stroke-width="3"><rect x="170" y="720" width="330" height="100" rx="12"/><rect x="1000" y="720" width="330" height="100" rx="12"/></g>
<g font-size="25" text-anchor="middle"><text x="335" y="205" font-weight="700">HOST A · VLAN 10</text><text x="335" y="237" font-size="20">access link</text><text x="1165" y="205" font-weight="700">HOST B · VLAN 10</text><text x="1165" y="237" font-size="20">access link</text><text x="335" y="765" font-weight="700">HOST C · VLAN 20</text><text x="335" y="797" font-size="20">access link</text><text x="1165" y="765" font-weight="700">HOST D · VLAN 20</text><text x="1165" y="797" font-size="20">access link</text></g>
<g fill="#244953" stroke="#163943" stroke-width="4"><rect x="180" y="365" width="300" height="250" rx="14"/><rect x="1020" y="365" width="300" height="250" rx="14"/></g><g fill="white" font-size="29" text-anchor="middle" font-weight="700"><text x="330" y="420">SWITCH 1</text><text x="1170" y="420">SWITCH 2</text></g><g fill="#a7c1c6"><rect x="235" y="463" width="50" height="40" rx="4"/><rect x="305" y="463" width="50" height="40" rx="4"/><rect x="375" y="463" width="50" height="40" rx="4"/><rect x="1075" y="463" width="50" height="40" rx="4"/><rect x="1145" y="463" width="50" height="40" rx="4"/><rect x="1215" y="463" width="50" height="40" rx="4"/></g><g fill="#d2e4e6" text-anchor="middle" font-size="20"><text x="330" y="565">Access and trunk ports</text><text x="1170" y="565">Access and trunk ports</text></g>
<rect x="550" y="535" width="400" height="85" rx="9" fill="white" stroke="#cbdeda" stroke-width="3"/><text x="750" y="568" text-anchor="middle" font-size="24" font-weight="700">802.1Q trunk</text><text x="750" y="598" text-anchor="middle" font-size="20">VLANs 10 and 20 allowed</text>
<g stroke="#195c70" stroke-width="3" fill="none"><path d="M115 430 L180 440"/><path d="M245 305 L335 365"/><path d="M560 405 L480 470"/><path d="M1110 120 L1165 160"/></g><g fill="white" stroke="#195c70" stroke-width="4"><circle cx="95" cy="430" r="26"/><circle cx="220" cy="295" r="26"/><circle cx="560" cy="380" r="26"/><circle cx="1090" cy="105" r="26"/></g><g font-size="24" fill="#174f60" font-weight="700" text-anchor="middle"><text x="95" y="438">1</text><text x="220" y="303">2</text><text x="560" y="388">3</text><text x="1090" y="113">4</text></g>
<text x="60" y="903" font-size="22" fill="#536b70">Blue = VLAN 10 · orange = VLAN 20. Colors show logical membership, not separate cables.</text><text x="60" y="939" font-size="22" fill="#536b70">Inter-VLAN communication requires routing or another Layer 3 function.</text></g></svg>