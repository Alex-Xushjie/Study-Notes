<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" role="img" aria-labelledby="t d"><title id="t">IPv6 address and prefix</title><desc id="d">The documentation address 2001:db8:0:1::10/64 expanded to eight hexadecimal groups; the first four groups form the prefix and the last four form the interface identifier in this example.</desc><rect width="1500" height="880" fill="#f5f8f7"/><g font-family="Arial,sans-serif" fill="#203f49"><text x="60" y="70" font-size="38" font-weight="700">EXPAND AN IPv6 ADDRESS</text><text x="60" y="120" font-size="26">Example: 2001:db8:0:1::10/64</text><path d="M95 230v-22h640v22 M735 230v-22h640v22" stroke="#327a8c" stroke-width="4" fill="none"/><text x="415" y="190" text-anchor="middle" font-size="22" font-weight="700">NETWORK PREFIX · 64 bits</text><text x="1055" y="190" text-anchor="middle" font-size="22" font-weight="700">INTERFACE IDENTIFIER · 64 bits</text><rect x="95" y="250" width="160" height="130" rx="5" fill="#c5e3ec" stroke="white" stroke-width="3"/><text x="175" y="320" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700">2001</text><text x="175" y="350" text-anchor="middle" font-size="18">16 bits</text><rect x="255" y="250" width="160" height="130" rx="5" fill="#c5e3ec" stroke="white" stroke-width="3"/><text x="335" y="320" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700">0db8</text><text x="335" y="350" text-anchor="middle" font-size="18">16 bits</text><rect x="415" y="250" width="160" height="130" rx="5" fill="#c5e3ec" stroke="white" stroke-width="3"/><text x="495" y="320" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700">0000</text><text x="495" y="350" text-anchor="middle" font-size="18">16 bits</text><rect x="575" y="250" width="160" height="130" rx="5" fill="#c5e3ec" stroke="white" stroke-width="3"/><text x="655" y="320" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700">0001</text><text x="655" y="350" text-anchor="middle" font-size="18">16 bits</text><rect x="735" y="250" width="160" height="130" rx="5" fill="#d7eacb" stroke="white" stroke-width="3"/><text x="815" y="320" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700">0000</text><text x="815" y="350" text-anchor="middle" font-size="18">16 bits</text><rect x="895" y="250" width="160" height="130" rx="5" fill="#d7eacb" stroke="white" stroke-width="3"/><text x="975" y="320" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700">0000</text><text x="975" y="350" text-anchor="middle" font-size="18">16 bits</text><rect x="1055" y="250" width="160" height="130" rx="5" fill="#d7eacb" stroke="white" stroke-width="3"/><text x="1135" y="320" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700">0000</text><text x="1135" y="350" text-anchor="middle" font-size="18">16 bits</text><rect x="1215" y="250" width="160" height="130" rx="5" fill="#d7eacb" stroke="white" stroke-width="3"/><text x="1295" y="320" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700">0010</text><text x="1295" y="350" text-anchor="middle" font-size="18">16 bits</text><g stroke="#21677a" stroke-width="3" fill="none"><path d="M415 440v-60 M735 620v-42 M1055 440v-60"/></g><g fill="white" stroke="#21677a" stroke-width="4"><circle cx="415" cy="470" r="27"/><circle cx="735" cy="650" r="27"/><circle cx="1055" cy="470" r="27"/></g><g text-anchor="middle" font-size="26" font-weight="700"><text x="415" y="479">1</text><text x="735" y="659">2</text><text x="1055" y="479">3</text></g><text x="735" y="565" text-anchor="middle" font-size="30" font-weight="700">2001:db8:0:1::10 / 64</text><text x="95" y="735" font-size="23">Eight groups × 16 bits = 128 bits. A single :: abbreviates consecutive zero groups.</text><text x="95" y="775" font-size="21" fill="#536b70">This /64 example uses a 64-bit interface identifier; prefix lengths can differ.</text></g></svg>