<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080" role="img" aria-labelledby="t d"><title id="t">A DNS lookup</title><desc id="d">A client asks a recursive resolver. On a cache miss, the resolver follows referrals from root and top-level domain servers to an authoritative server and returns the answer to the client.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#19788b"/></marker></defs><rect width="1500" height="1080" fill="#f5f8f7"/><g font-family="Arial,sans-serif" fill="#203f49"><text x="60" y="70" font-size="38" font-weight="700">FOLLOW A DNS LOOKUP</text><text x="60" y="112" font-size="23">One illustrative cache-miss path; actual lookups may use cached answers.</text><g fill="#e2f0f2" stroke="#8bb8c0" stroke-width="3"><rect x="95" y="170" width="320" height="120" rx="12"/><rect x="590" y="170" width="320" height="120" rx="12"/><rect x="1085" y="170" width="320" height="120" rx="12"/><rect x="1085" y="450" width="320" height="120" rx="12"/><rect x="1085" y="730" width="320" height="120" rx="12"/></g><g text-anchor="middle" font-size="25" font-weight="700"><text x="255" y="220">DNS CLIENT</text><text x="255" y="255" font-size="19" font-weight="400">asks for a record</text><text x="750" y="220">RECURSIVE</text><text x="750" y="255">RESOLVER</text><text x="1245" y="220">ROOT SERVER</text><text x="1245" y="500">TLD SERVER</text><text x="1245" y="780">AUTHORITATIVE</text><text x="1245" y="815">SERVER</text></g><g stroke="#19788b" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M415 210 H580"/><path d="M590 265 H425"/><path d="M910 210 H1075"/><path d="M1085 265 H920"/><path d="M750 290 V405 H1065 V465"/><path d="M1085 545 H820 V310"/><path d="M750 310 V680 H1065 V745"/><path d="M1085 825 H820 V315"/></g><g font-size="19" fill="#335760"><text x="430" y="195">query</text><text x="435" y="295">answer</text><text x="925" y="195">query</text><text x="935" y="295">referral</text><text x="820" y="395">query</text><text x="890" y="535">referral</text><text x="845" y="670">query</text><text x="910" y="815">answer</text></g><g stroke="#195f72" stroke-width="3" fill="white"><circle cx="145" cy="165" r="27"/><circle cx="630" cy="165" r="27"/><circle cx="1115" cy="720" r="27"/><circle cx="500" cy="170" r="27"/></g><g font-size="25" font-weight="700" text-anchor="middle"><text x="145" y="174">1</text><text x="630" y="174">2</text><text x="1115" y="729">3</text><text x="500" y="179">4</text></g><text x="95" y="950" font-size="22" fill="#536e73">Root and TLD servers provide referrals in this example; the resolver follows them.</text><text x="95" y="990" font-size="22" fill="#536e73">Caching, delegation and transport choices can change the path.</text></g></svg>