<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">Forwarding toward a destination</title><desc id="d">A source host sends a packet through two routers toward a destination network. Router 1 chooses router 2 as the next hop.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#19788b"/></marker></defs><rect width="1500" height="850" fill="#f5f8f7"/><g font-family="Arial" fill="#203f49"><text x="60" y="70" font-size="38" font-weight="700">FORWARDING ONE IPv4 PACKET</text><text x="60" y="112" font-size="23">Router 1 selects a next hop using the destination address.</text><g fill="#d9eef0" stroke="#8db9c0" stroke-width="3"><rect x="80" y="240" width="270" height="140" rx="12"/><rect x="480" y="240" width="230" height="140" rx="12"/><rect x="850" y="240" width="230" height="140" rx="12"/><rect x="1210" y="240" width="230" height="140" rx="12"/></g><g text-anchor="middle" font-size="25" font-weight="700"><text x="215" y="295">SOURCE HOST</text><text x="595" y="295">ROUTER 1</text><text x="965" y="295">ROUTER 2</text><text x="1325" y="295">DESTINATION</text><text x="1325" y="330" font-size="20">NETWORK</text></g><g stroke="#19788b" stroke-width="6" fill="none" marker-end="url(#a)"><path d="M355 310H470"/><path d="M715 310H840"/><path d="M1085 310H1200"/></g><text x="775" y="275" text-anchor="middle" font-size="20">next hop</text><g fill="white" stroke="#195f72" stroke-width="4"><circle cx="215" cy="205" r="27"/><circle cx="595" cy="205" r="27"/><circle cx="965" cy="205" r="27"/><circle cx="1325" cy="205" r="27"/></g><g font-weight="700" text-anchor="middle" font-size="25"><text x="215" y="214">1</text><text x="595" y="214">2</text><text x="965" y="214">3</text><text x="1325" y="214">4</text></g><rect x="290" y="470" width="930" height="200" rx="12" fill="white" stroke="#cadeda" stroke-width="3"/><text x="330" y="520" font-size="24" font-weight="700">At each router</text><text x="330" y="560" font-size="22">1. Look up the destination in the forwarding table.</text><text x="330" y="600" font-size="22">2. Select an outgoing interface and next hop, if needed.</text><text x="330" y="640" font-size="22">3. Update IPv4 TTL and encapsulate for the outgoing link.</text><text x="80" y="760" font-size="21" fill="#536e73">Example only: routing policy, NAT, tunnels, fragmentation and return traffic are not shown.</text></g></svg>