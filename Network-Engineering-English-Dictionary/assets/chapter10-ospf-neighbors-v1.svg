<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" role="img" aria-labelledby="t d"><title id="t">OSPF neighbors on a point-to-point link</title><desc id="d">Two OSPF routers exchange Hello packets, discover each other, synchronize their databases and reach Full in a successful adjacency.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#19788b"/></marker></defs><rect width="1500" height="950" fill="#f5f8f7"/><g font-family="Arial" fill="#203f49"><text x="60" y="70" font-size="38" font-weight="700">FROM HELLO TO ADJACENCY</text><text x="60" y="112" font-size="23">OSPFv2 example: two routers on a point-to-point link.</text><g fill="#d9eef0" stroke="#8db9c0" stroke-width="3"><rect x="150" y="180" width="300" height="140" rx="12"/><rect x="1050" y="180" width="300" height="140" rx="12"/></g><g font-size="27" font-weight="700" text-anchor="middle"><text x="300" y="245">ROUTER A</text><text x="1200" y="245">ROUTER B</text></g><g stroke="#19788b" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M455 220H1040"/><path d="M1045 285H460"/></g><text x="750" y="205" font-size="24" font-weight="700" text-anchor="middle">HELLO</text><text x="750" y="320" font-size="24" font-weight="700" text-anchor="middle">HELLO</text><rect x="140" y="415" width="1220" height="200" rx="12" fill="white" stroke="#d2e2de" stroke-width="3"/><g font-size="23"><text x="185" y="465">Discover neighbor → establish two-way communication</text><text x="185" y="515">→ exchange database descriptions and request missing LSAs</text><text x="185" y="565">→ databases synchronized for this adjacency: Full</text></g><g fill="white" stroke="#195f72" stroke-width="4"><circle cx="200" cy="165" r="27"/><circle cx="750" cy="160" r="27"/><circle cx="1250" cy="165" r="27"/><circle cx="110" cy="510" r="27"/></g><g font-size="25" text-anchor="middle" font-weight="700"><text x="200" y="174">1</text><text x="750" y="169">2</text><text x="1250" y="174">3</text><text x="110" y="519">4</text></g><text x="90" y="730" font-size="22" fill="#536e73">The steps are simplified. Compatible settings and working bidirectional communication are required.</text><text x="90" y="770" font-size="22" fill="#536e73">On multiaccess networks, not every neighbor pair forms a Full adjacency.</text></g></svg>