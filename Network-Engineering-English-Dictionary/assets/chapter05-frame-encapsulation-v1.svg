<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
<title id="title">Inside an Ethernet frame carrying IPv4 and TCP</title><desc id="desc">A left-to-right Ethernet frame showing the Ethernet header, IPv4 header, TCP header, HTTP data and FCS. Brackets identify the packet, segment, and frame, and numbers identify header, packet, payload, and trailer.</desc>
<rect width="1500" height="950" fill="#f5f8f7"/><g font-family="Arial,sans-serif" fill="#1d3f49"><text x="60" y="74" font-size="38" font-weight="700">INSIDE A FRAME</text><text x="60" y="118" font-size="23" fill="#536d73">One Ethernet II frame carrying an IPv4 packet and a TCP segment</text>
<path d="M85 200v-22h1330v22" fill="none" stroke="#33748a" stroke-width="4"/><text x="750" y="165" text-anchor="middle" font-size="25" font-weight="700">Ethernet frame</text>
<path d="M380 280v-22h915v22" fill="none" stroke="#328b6e" stroke-width="4"/><text x="835" y="244" text-anchor="middle" font-size="24" font-weight="700">IPv4 packet</text>
<path d="M620 355v-22h675v22" fill="none" stroke="#bd8e28" stroke-width="4"/><text x="955" y="320" text-anchor="middle" font-size="24" font-weight="700">TCP segment</text>
<g stroke="white" stroke-width="4"><rect x="85" y="420" width="295" height="180" rx="8" fill="#d8c5ee"/><rect x="380" y="420" width="240" height="180" fill="#b9e2b8"/><rect x="620" y="420" width="230" height="180" fill="#f8d894"/><rect x="850" y="420" width="445" height="180" fill="#dae8f6"/><rect x="1295" y="420" width="120" height="180" rx="8" fill="#f5c2b5"/></g>
<g text-anchor="middle"><text x="232" y="475" font-size="24" font-weight="700">Ethernet header</text><text x="232" y="512" font-size="20">Destination MAC</text><text x="232" y="541" font-size="20">Source MAC</text><text x="232" y="570" font-size="20">EtherType</text><text x="500" y="475" font-size="24" font-weight="700">IPv4 header</text><text x="500" y="512" font-size="20">Source and</text><text x="500" y="541" font-size="20">destination IP</text><text x="735" y="475" font-size="24" font-weight="700">TCP header</text><text x="735" y="512" font-size="20">Ports and</text><text x="735" y="541" font-size="20">sequence number</text><text x="1072" y="475" font-size="24" font-weight="700">TCP payload</text><text x="1072" y="512" font-size="20">HTTP request data</text><text x="1355" y="475" font-size="24" font-weight="700">FCS</text><text x="1355" y="512" font-size="19">trailer</text></g>
<g fill="none" stroke="#1e6980" stroke-width="3"><path d="M230 670 L230 600"/><path d="M505 272 L505 258"/><path d="M1072 670 L1072 600"/><path d="M1355 670 L1355 600"/></g>
<g fill="white" stroke="#1e6980" stroke-width="4"><circle cx="230" cy="700" r="28"/><circle cx="505" cy="300" r="28"/><circle cx="1072" cy="700" r="28"/><circle cx="1355" cy="700" r="28"/></g><g text-anchor="middle" font-size="26" font-weight="700" fill="#174d5e"><text x="230" y="709">1</text><text x="505" y="309">2</text><text x="1072" y="709">3</text><text x="1355" y="709">4</text></g>
<text x="85" y="800" font-size="22" fill="#50686d">Simplified; field widths are not to scale. Optional VLAN tags and Ethernet padding are omitted.</text><text x="85" y="840" font-size="22" fill="#50686d">Payload depends on the layer: the TCP payload shown here carries application bytes.</text><text x="85" y="880" font-size="22" fill="#50686d">The FCS belongs to the Ethernet frame, not the IPv4 packet.</text></g></svg>