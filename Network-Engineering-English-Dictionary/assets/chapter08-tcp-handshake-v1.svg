<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-labelledby="t d"><title id="t">TCP connection setup</title><desc id="d">An example TCP three-way handshake: client SYN sequence 100, server SYN ACK sequence 300 acknowledgment 101, and client ACK sequence 101 acknowledgment 301.</desc><defs><marker id="end" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#19788b"/></marker></defs><rect width="1500" height="1000" fill="#f5f8f7"/><g font-family="Arial,sans-serif" fill="#203f49"><text x="60" y="70" font-size="38" font-weight="700">A TCP CONNECTION OPENS</text><text x="60" y="112" font-size="23">Example sequence numbers; actual values vary by connection.</text><rect x="170" y="150" width="280" height="90" rx="12" fill="#d2eaf0"/><rect x="1050" y="150" width="280" height="90" rx="12" fill="#d2eaf0"/><g text-anchor="middle" font-weight="700" font-size="28"><text x="310" y="205">CLIENT</text><text x="1190" y="205">SERVER</text></g><path d="M310 245 V830 M1190 245 V830" stroke="#96b4ba" stroke-width="4" stroke-dasharray="10 10"/><g stroke="#19788b" stroke-width="5" fill="none" marker-end="url(#end)"><path d="M315 350 L1180 350"/><path d="M1185 510 L320 510"/><path d="M315 670 L1180 670"/></g><g text-anchor="middle" font-weight="700" font-size="28"><text x="750" y="320">SYN · SEQ 100</text><text x="750" y="480">SYN + ACK · SEQ 300 · ACK 101</text><text x="750" y="640">ACK · SEQ 101 · ACK 301</text></g><g font-size="22" text-anchor="middle" fill="#536e73"><text x="750" y="389">Client announces its initial sequence number.</text><text x="750" y="549">Server acknowledges the client and announces its own number.</text><text x="750" y="709">Client acknowledges the server; the server can complete setup.</text></g><g fill="white" stroke="#19788b" stroke-width="4"><circle cx="365" cy="300" r="28"/><circle cx="1130" cy="460" r="28"/><circle cx="365" cy="620" r="28"/></g><g text-anchor="middle" font-size="26" font-weight="700"><text x="365" y="309">1</text><text x="1130" y="469">2</text><text x="365" y="629">3</text></g><text x="60" y="900" font-size="22" fill="#536e73">Each SYN consumes one sequence number. Options and loss recovery are omitted.</text><text x="60" y="940" font-size="22" fill="#536e73">Successful TCP setup does not by itself prove the application is working.</text></g></svg>