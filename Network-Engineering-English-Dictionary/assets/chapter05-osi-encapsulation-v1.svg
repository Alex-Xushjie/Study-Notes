<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1530" role="img" aria-labelledby="title desc"><title id="title">An HTTP request down the seven OSI layers</title><desc id="desc">A simplified send-side example of HTTP over TCP, IPv4 and Ethernet. Layers seven through five show application data. TCP and IPv4 add headers; Ethernet adds a header and frame check sequence; the physical layer sends signals.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#188098"/></marker></defs><rect width="1500" height="1530" fill="#f5f8f7"/><text x="60" y="72" font-family="Arial" font-size="38" font-weight="700" fill="#173b49">FROM APPLICATION TO NETWORK</text><text x="60" y="112" font-family="Arial" font-size="24" fill="#49636c">One example: HTTP request → TCP → IPv4 → Ethernet</text><path d="M98 165 L98 1398" stroke="#72bac3" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="145" y="145" width="1295" height="166" rx="14" fill="white" stroke="#d6e2e0" stroke-width="2"/><circle cx="98" cy="190" r="31" fill="#106f83" stroke="white" stroke-width="4"/><text x="98" y="199" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">7</text><text x="173" y="185" font-family="Arial" font-size="23" font-weight="700" fill="#13778d">LAYER 7 · APPLICATION</text><text x="530" y="185" font-family="Arial" font-size="23" font-weight="700" fill="#24404b">HTTP request</text><text x="173" y="220" font-family="Arial" font-size="21" fill="#4b646a">The application creates an HTTP request.</text><text x="173" y="270" font-family="Arial" font-size="17" font-weight="700" fill="#4b646a">DATA</text><rect x="420" y="239" width="960" height="48" rx="5" fill="#dae8f6" stroke="white" stroke-width="2"/><text x="900.0" y="269" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">HTTP request bytes</text><rect x="145" y="333" width="1295" height="166" rx="14" fill="white" stroke="#d6e2e0" stroke-width="2"/><circle cx="98" cy="378" r="31" fill="#106f83" stroke="white" stroke-width="4"/><text x="98" y="387" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">6</text><text x="173" y="373" font-family="Arial" font-size="23" font-weight="700" fill="#13778d">LAYER 6 · PRESENTATION</text><text x="530" y="373" font-family="Arial" font-size="23" font-weight="700" fill="#24404b">Representation</text><text x="173" y="408" font-family="Arial" font-size="21" fill="#4b646a">Represent the request as bytes; no extra header in this example.</text><text x="173" y="458" font-family="Arial" font-size="17" font-weight="700" fill="#4b646a">DATA</text><rect x="420" y="427" width="960" height="48" rx="5" fill="#dae8f6" stroke="white" stroke-width="2"/><text x="900.0" y="457" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">HTTP request bytes</text><rect x="145" y="521" width="1295" height="166" rx="14" fill="white" stroke="#d6e2e0" stroke-width="2"/><circle cx="98" cy="566" r="31" fill="#106f83" stroke="white" stroke-width="4"/><text x="98" y="575" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">5</text><text x="173" y="561" font-family="Arial" font-size="23" font-weight="700" fill="#13778d">LAYER 5 · SESSION</text><text x="530" y="561" font-family="Arial" font-size="23" font-weight="700" fill="#24404b">Conversation</text><text x="173" y="596" font-family="Arial" font-size="21" fill="#4b646a">Manage the conversation; no separate session header is assumed.</text><text x="173" y="646" font-family="Arial" font-size="17" font-weight="700" fill="#4b646a">DATA</text><rect x="420" y="615" width="960" height="48" rx="5" fill="#dae8f6" stroke="white" stroke-width="2"/><text x="900.0" y="645" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">HTTP request bytes</text><rect x="145" y="709" width="1295" height="166" rx="14" fill="white" stroke="#d6e2e0" stroke-width="2"/><circle cx="98" cy="754" r="31" fill="#106f83" stroke="white" stroke-width="4"/><text x="98" y="763" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">4</text><text x="173" y="749" font-family="Arial" font-size="23" font-weight="700" fill="#13778d">LAYER 4 · TRANSPORT</text><text x="530" y="749" font-family="Arial" font-size="23" font-weight="700" fill="#24404b">TCP</text><text x="173" y="784" font-family="Arial" font-size="21" fill="#4b646a">TCP adds a header; it may split the byte stream into segments.</text><text x="173" y="834" font-family="Arial" font-size="17" font-weight="700" fill="#4b646a">SEGMENT</text><rect x="420" y="803" width="240" height="48" rx="5" fill="#f8d894" stroke="white" stroke-width="2"/><text x="540.0" y="833" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">TCP header</text><rect x="660" y="803" width="720" height="48" rx="5" fill="#dae8f6" stroke="white" stroke-width="2"/><text x="1020.0" y="833" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">HTTP request data</text><rect x="145" y="897" width="1295" height="166" rx="14" fill="white" stroke="#d6e2e0" stroke-width="2"/><circle cx="98" cy="942" r="31" fill="#106f83" stroke="white" stroke-width="4"/><text x="98" y="951" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">3</text><text x="173" y="937" font-family="Arial" font-size="23" font-weight="700" fill="#13778d">LAYER 3 · NETWORK</text><text x="530" y="937" font-family="Arial" font-size="23" font-weight="700" fill="#24404b">IPv4</text><text x="173" y="972" font-family="Arial" font-size="21" fill="#4b646a">IPv4 adds source and destination IP addresses and other fields.</text><text x="173" y="1022" font-family="Arial" font-size="17" font-weight="700" fill="#4b646a">PACKET</text><rect x="420" y="991" width="205" height="48" rx="5" fill="#b9e2b8" stroke="white" stroke-width="2"/><text x="522.5" y="1021" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">IPv4 header</text><rect x="625" y="991" width="220" height="48" rx="5" fill="#f8d894" stroke="white" stroke-width="2"/><text x="735.0" y="1021" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">TCP header</text><rect x="845" y="991" width="535" height="48" rx="5" fill="#dae8f6" stroke="white" stroke-width="2"/><text x="1112.5" y="1021" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">HTTP data</text><rect x="145" y="1085" width="1295" height="166" rx="14" fill="white" stroke="#d6e2e0" stroke-width="2"/><circle cx="98" cy="1130" r="31" fill="#106f83" stroke="white" stroke-width="4"/><text x="98" y="1139" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">2</text><text x="173" y="1125" font-family="Arial" font-size="23" font-weight="700" fill="#13778d">LAYER 2 · DATA LINK</text><text x="530" y="1125" font-family="Arial" font-size="23" font-weight="700" fill="#24404b">Ethernet</text><text x="173" y="1160" font-family="Arial" font-size="21" fill="#4b646a">For this link, Ethernet adds a header and an FCS trailer.</text><text x="173" y="1210" font-family="Arial" font-size="17" font-weight="700" fill="#4b646a">FRAME</text><rect x="420" y="1179" width="185" height="48" rx="5" fill="#d8c5ee" stroke="white" stroke-width="2"/><text x="512.5" y="1209" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">Ethernet hdr</text><rect x="605" y="1179" width="165" height="48" rx="5" fill="#b9e2b8" stroke="white" stroke-width="2"/><text x="687.5" y="1209" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">IPv4 hdr</text><rect x="770" y="1179" width="160" height="48" rx="5" fill="#f8d894" stroke="white" stroke-width="2"/><text x="850.0" y="1209" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">TCP hdr</text><rect x="930" y="1179" width="360" height="48" rx="5" fill="#dae8f6" stroke="white" stroke-width="2"/><text x="1110.0" y="1209" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">HTTP data</text><rect x="1290" y="1179" width="90" height="48" rx="5" fill="#f5c2b5" stroke="white" stroke-width="2"/><text x="1335.0" y="1209" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">FCS</text><rect x="145" y="1273" width="1295" height="166" rx="14" fill="white" stroke="#d6e2e0" stroke-width="2"/><circle cx="98" cy="1318" r="31" fill="#106f83" stroke="white" stroke-width="4"/><text x="98" y="1327" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">1</text><text x="173" y="1313" font-family="Arial" font-size="23" font-weight="700" fill="#13778d">LAYER 1 · PHYSICAL</text><text x="530" y="1313" font-family="Arial" font-size="23" font-weight="700" fill="#24404b">Signals</text><text x="173" y="1348" font-family="Arial" font-size="21" fill="#4b646a">The Ethernet PHY encodes and transmits bits on the medium.</text><text x="173" y="1398" font-family="Arial" font-size="17" font-weight="700" fill="#4b646a">SIGNALS</text><rect x="420" y="1367" width="960" height="48" rx="5" fill="#e4ecef" stroke="white" stroke-width="2"/><text x="900.0" y="1397" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#24404b">Electrical or optical signals on the link</text><text x="60" y="1500" font-family="Arial" font-size="21" fill="#4b646a">Illustrative, not to scale · Layers 5–6 are functional concepts in this TCP/IP example.</text></svg>