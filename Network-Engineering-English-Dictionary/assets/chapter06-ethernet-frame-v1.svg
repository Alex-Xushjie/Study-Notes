<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 790" role="img" aria-labelledby="t d"><title id="t">Fields in an Ethernet II frame</title><desc id="d">An untagged Ethernet II frame has destination and source MAC addresses, EtherType, data, optional padding and an FCS. Numbered markers identify destination MAC, source MAC, payload and trailer.</desc><rect width="1500" height="790" fill="#f5f8f7"/><g font-family="Arial,sans-serif" fill="#203f49"><text x="55" y="65" font-size="38" font-weight="700">READING AN ETHERNET FRAME</text><text x="55" y="107" font-size="23" fill="#587176">Example: untagged Ethernet II frame carrying IPv4</text><path d="M65 205v-25h1365v25" fill="none" stroke="#437d8a" stroke-width="4"/><text x="750" y="165" text-anchor="middle" font-size="24" font-weight="700">Ethernet MAC frame</text>
<g stroke="white" stroke-width="4"><rect x="65" y="310" width="240" height="185" rx="7" fill="#c8e4ef"/><rect x="305" y="310" width="240" height="185" fill="#b9d7eb"/><rect x="545" y="310" width="180" height="185" fill="#d8c5ee"/><rect x="725" y="310" width="400" height="185" fill="#c5e5bf"/><rect x="1125" y="310" width="175" height="185" fill="#e9ece8"/><rect x="1300" y="310" width="130" height="185" rx="7" fill="#f5c2b5"/></g>
<g text-anchor="middle" font-size="21"><text x="185" y="355" font-size="24" font-weight="700">Destination</text><text x="185" y="386" font-size="24" font-weight="700">MAC</text><text x="185" y="429">6 bytes</text><text x="425" y="355" font-size="24" font-weight="700">Source</text><text x="425" y="386" font-size="24" font-weight="700">MAC</text><text x="425" y="429">6 bytes</text><text x="635" y="370" font-size="24" font-weight="700">EtherType</text><text x="635" y="410">2 bytes</text><text x="635" y="447">0x0800: IPv4</text><text x="925" y="370" font-size="24" font-weight="700">Payload</text><text x="925" y="410">IPv4 packet</text><text x="925" y="447">variable length</text><text x="1212" y="370" font-size="24" font-weight="700">Padding</text><text x="1212" y="410">if needed</text><text x="1365" y="370" font-size="24" font-weight="700">FCS</text><text x="1365" y="410">4 bytes</text></g>
<g stroke="#1e6980" stroke-width="3" fill="none"><path d="M185 240v70"/><path d="M425 240v70"/><path d="M925 240v70"/><path d="M1365 240v70"/></g><g fill="white" stroke="#1e6980" stroke-width="4"><circle cx="185" cy="215" r="27"/><circle cx="425" cy="215" r="27"/><circle cx="925" cy="215" r="27"/><circle cx="1365" cy="215" r="27"/></g><g text-anchor="middle" font-size="25" font-weight="700"><text x="185" y="224">1</text><text x="425" y="224">2</text><text x="925" y="224">3</text><text x="1365" y="224">4</text></g>
<text x="65" y="590" font-size="22" fill="#526a70">FCS detects corruption; padding, when present, is not part of the IPv4 packet.</text><text x="65" y="630" font-size="22" fill="#526a70">Preamble and start-of-frame delimiter are omitted. Field widths are not to scale.</text><text x="65" y="670" font-size="22" fill="#526a70">An optional 802.1Q tag, when present, follows the source MAC address.</text></g></svg>