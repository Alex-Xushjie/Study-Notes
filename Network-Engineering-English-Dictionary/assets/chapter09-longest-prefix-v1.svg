<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Longest prefix match</title><desc id="d">For destination 192.0.2.10, routes 0.0.0.0/0, 192.0.0.0/16 and 192.0.2.0/24 all match; the /24 route is the longest matching prefix.</desc><rect width="1500" height="900" fill="#f5f8f7"/><g font-family="Arial" fill="#203f49"><text x="60" y="70" font-size="38" font-weight="700">WHICH ROUTE MATCHES BEST?</text><text x="60" y="120" font-size="26">Destination: 192.0.2.10</text><g font-size="24" font-weight="700"><text x="180" y="198">MATCHING ROUTE</text><text x="760" y="198">PREFIX LENGTH</text><text x="1100" y="198">RESULT</text></g><g stroke="#dae5e2" stroke-width="3"><rect x="95" y="220" width="1310" height="130" rx="10" fill="white"/><rect x="95" y="380" width="1310" height="130" rx="10" fill="white"/><rect x="95" y="540" width="1310" height="130" rx="10" fill="#ddf0e0"/></g><g font-size="27"><text x="180" y="295">0.0.0.0/0</text><text x="800" y="295">0 bits</text><text x="1100" y="295">matches</text><text x="180" y="455">192.0.0.0/16</text><text x="800" y="455">16 bits</text><text x="1100" y="455">matches</text><text x="180" y="615" font-weight="700">192.0.2.0/24</text><text x="800" y="615" font-weight="700">24 bits</text><text x="1100" y="615" font-weight="700">SELECTED</text></g><g stroke="#195f72" stroke-width="4" fill="white"><circle cx="125" cy="285" r="26"/><circle cx="125" cy="445" r="26"/><circle cx="125" cy="605" r="26"/></g><g font-weight="700" font-size="25" text-anchor="middle"><text x="125" y="294">1</text><text x="125" y="454">2</text><text x="125" y="614">3</text></g><text x="95" y="750" font-size="24">All three routes match; /24 has the greatest number of matching prefix bits.</text><text x="95" y="795" font-size="22" fill="#536e73">Assumes all three are eligible installed routes in the same forwarding context.</text><text x="95" y="835" font-size="22" fill="#536e73">Route preferences and equal-cost paths are separate considerations for a given prefix.</text></g></svg>