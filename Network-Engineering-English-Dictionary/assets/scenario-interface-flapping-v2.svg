<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc"><title id="title">A link flap and the evidence</title><desc id="desc">An illustrative local switch interface connected to a provider edge, with two down and up events, log records, and interface error counter snapshots. The cause is not shown.</desc><rect width="1500" height="1000" fill="#f5f8f7"/><g font-family="Arial,sans-serif" fill="#173d49"><text x="65" y="65" font-size="36" font-weight="700">A LINK THAT KEEPS GOING DOWN</text><text x="65" y="104" font-size="21" fill="#5d7378">Illustrative case · all times UTC · cause not yet confirmed</text>
<rect x="110" y="165" width="430" height="210" rx="14" fill="#243e49"/><text x="325" y="220" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">LOCAL SWITCH</text><g fill="#90b4bb"><rect x="150" y="250" width="48" height="42" rx="3"/><rect x="210" y="250" width="48" height="42" rx="3"/><rect x="270" y="250" width="48" height="42" rx="3"/><rect x="330" y="250" width="48" height="42" rx="3"/><rect x="390" y="250" width="48" height="42" rx="3"/></g><rect x="450" y="245" width="58" height="52" rx="4" fill="#a6d7c2" stroke="#fff" stroke-width="3"/><text x="325" y="340" text-anchor="middle" fill="#dceef0" font-size="20">Interface Ethernet1/1</text><path d="M508 270 H1050" stroke="#388da0" stroke-width="9" fill="none"/><rect x="1050" y="165" width="340" height="210" rx="14" fill="#dbeaf0" stroke="#92b9c1" stroke-width="3"/><text x="1220" y="242" text-anchor="middle" font-size="27" font-weight="700">PROVIDER EDGE</text><text x="1220" y="280" text-anchor="middle" font-size="20">remote device</text><text x="775" y="248" text-anchor="middle" font-size="20">network link</text>
<rect x="110" y="440" width="1280" height="215" rx="12" fill="white" stroke="#d0dfdd" stroke-width="3"/><text x="150" y="482" font-size="24" font-weight="700">LINK-STATE LOG · Ethernet1/1</text><g font-family="monospace" font-size="22"><text x="160" y="530">09:10:00  DOWN</text><text x="160" y="570">09:10:07  UP</text><text x="600" y="530">09:18:00  DOWN</text><text x="600" y="570">09:18:06  UP</text><text x="1045" y="550" fill="#776747">2 flaps observed</text></g>
<rect x="110" y="710" width="1280" height="160" rx="12" fill="white" stroke="#d0dfdd" stroke-width="3"/><text x="150" y="755" font-size="24" font-weight="700">INTERFACE COUNTER SNAPSHOTS</text><text x="160" y="810" font-family="monospace" font-size="22">Input errors: 12 at 09:10  →  15 at 09:30</text><text x="910" y="810" font-size="20">An increase is evidence, not a diagnosis.</text>
