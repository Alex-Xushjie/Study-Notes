<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-labelledby="t d"><title id="t">OSPF link state and shortest path</title><desc id="d">Illustrative OSPF point-to-point topology: R1 reaches R3 via R2 with cost 20 instead of direct cost 30. Link-state advertisements populate the database used by SPF.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#19788b"/></marker></defs><rect width="1500" height="1000" fill="#f5f8f7"/><g font-family="Arial" fill="#203f49"><text x="60" y="70" font-size="38" font-weight="700">LINK STATE → SHORTEST PATH</text><text x="60" y="112" font-size="23">One intra-area example, calculated from R1.</text><g stroke="#19788b" stroke-width="6" fill="none" marker-end="url(#a)"><path d="M310 340L710 230"/><path d="M790 230L1190 340"/><path d="M315 390H1180"/></g><g fill="#d9eef0" stroke="#8db9c0" stroke-width="4"><circle cx="250" cy="365" r="65"/><circle cx="750" cy="215" r="65"/><circle cx="1250" cy="365" r="65"/></g><g text-anchor="middle" font-size="28" font-weight="700"><text x="250" y="375">R1</text><text x="750" y="225">R2</text><text x="1250" y="375">R3</text><text x="480" y="250" font-size="24">cost 10 →</text><text x="1010" y="250" font-size="24">cost 10 →</text><text x="750" y="435" font-size="24">direct cost 30 →</text></g><rect x="110" y="530" width="1280" height="235" rx="12" fill="white" stroke="#d2e2de" stroke-width="3"/><g font-size="23"><text x="190" y="580">LSAs describe link-state information and are flooded in their scope.</text><text x="190" y="625">R1 uses its link-state database (LSDB) as input to SPF.</text><text x="190" y="670">R1 → R2 → R3 costs 10 + 10 = 20; direct R1 → R3 costs 30.</text><text x="190" y="715">The lower-cost path to R3 in this topology is via R2.</text></g><g fill="white" stroke="#195f72" stroke-width="4"><circle cx="145" cy="625" r="21"/><circle cx="145" cy="670" r="21"/><circle cx="750" cy="480" r="27"/><circle cx="145" cy="580" r="21"/></g><g font-size="25" text-anchor="middle" font-weight="700"><text x="145" y="634">1</text><text x="145" y="679">2</text><text x="750" y="489">3</text><text x="145" y="589">4</text></g><text x="100" y="860" font-size="22" fill="#536e73">Costs shown are in the direction from R1 toward R3; reverse interface costs can differ.</text><text x="100" y="900" font-size="22" fill="#536e73">This is a topology calculation; route installation and forwarding have additional conditions.</text></g></svg>