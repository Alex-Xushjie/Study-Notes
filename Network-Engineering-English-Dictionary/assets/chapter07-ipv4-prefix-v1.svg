<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" role="img" aria-labelledby="t d"><title id="t">IPv4 address and prefix</title><desc id="d">The documentation address 192.0.2.10/24 has four octets; its first 24 bits are the prefix, and its last eight bits are the host portion.</desc><rect width="1500" height="880" fill="#f5f8f7"/><g font-family="Arial,sans-serif" fill="#203f49"><text x="60" y="70" font-size="38" font-weight="700">AN IPv4 ADDRESS, BIT BY BIT</text><text x="60" y="115" font-size="24">Example: 192.0.2.10/24</text><path d="M95 232v-22h945v22 M1040 232v-22h315v22" stroke="#327a8c" stroke-width="4" fill="none"/><text x="565" y="190" text-anchor="middle" font-size="23" font-weight="700">NETWORK PREFIX · first 24 bits</text><text x="1197" y="190" text-anchor="middle" font-size="23" font-weight="700">HOST PORTION · 8 bits</text><rect x="95" y="250" width="315" height="165" rx="7" fill="#c5e3ec" stroke="white" stroke-width="3"/><text x="252" y="315" text-anchor="middle" font-size="42" font-weight="700">192</text><text x="252" y="370" text-anchor="middle" font-size="25" font-family="monospace">11000000</text><rect x="410" y="250" width="315" height="165" rx="7" fill="#c5e3ec" stroke="white" stroke-width="3"/><text x="567" y="315" text-anchor="middle" font-size="42" font-weight="700">0</text><text x="567" y="370" text-anchor="middle" font-size="25" font-family="monospace">00000000</text><rect x="725" y="250" width="315" height="165" rx="7" fill="#c5e3ec" stroke="white" stroke-width="3"/><text x="882" y="315" text-anchor="middle" font-size="42" font-weight="700">2</text><text x="882" y="370" text-anchor="middle" font-size="25" font-family="monospace">00000010</text><rect x="1040" y="250" width="315" height="165" rx="7" fill="#d7eacb" stroke="white" stroke-width="3"/><text x="1197" y="315" text-anchor="middle" font-size="42" font-weight="700">10</text><text x="1197" y="370" text-anchor="middle" font-size="25" font-family="monospace">00001010</text><g stroke="#21677a" stroke-width="3" fill="none"><path d="M250 475v-60 M565 475v-60 M1197 475v-60 M740 615V570"/></g><g fill="white" stroke="#21677a" stroke-width="4"><circle cx="250" cy="505" r="27"/><circle cx="565" cy="505" r="27"/><circle cx="1197" cy="505" r="27"/><circle cx="740" cy="645" r="27"/></g><g text-anchor="middle" font-size="26" font-weight="700"><text x="250" y="514">1</text><text x="565" y="514">2</text><text x="1197" y="514">3</text><text x="740" y="654">4</text></g><text x="750" y="570" text-anchor="middle" font-size="28" font-weight="700">192.0.2.10 / 24</text><text x="95" y="740" font-size="23">Network: 192.0.2.0/24 · Mask: 255.255.255.0 · All four boxes make one 32-bit address.</text><text x="95" y="780" font-size="21" fill="#536b70">This is a documentation address. Prefixes are not always aligned to octet boundaries.</text></g></svg>